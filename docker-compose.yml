services:
  main-db:
    image: postgres:16.13
    container_name: main-db
    ports:
      - "6432:5432"
    environment:
      - POSTGRES_PASSWORD=root
      - POSTGRES_USER=root
      - POSTGRES_DB=postgres
    healthcheck:
      test: pg_isready -q -d $$POSTGRES_DB -U $$POSTGRES_USER
      timeout: 5s
      interval: 5s
      retries: 10
  db-init:
    image: postgres:16.13
    container_name: db-init
    depends_on:
      main-db:
        condition: service_healthy
    entrypoint:
      - bash
      - -c
      - |
        set -e
        psql postgresql://root:root@main-db:5432/postgres -v ON_ERROR_STOP=1 <<-EOSQL
        CREATE DATABASE IF NOT EXISTS externalorderdb;
        EOSQL