spring:
  application:
    name: configuration-service
  profiles:
    active: native
  cloud:
    config:
      server:
        native:
          searchLocations:
            - classpath:configurations/infrastructure/{application}
            - classpath:configurations/interaction/receiving/{application}

eureka:
  client:
    serviceUrl:
      defaultZone: http://${eureka.instance.hostname:localhost}:${eureka.instance.port:8761}/eureka/

logging:
  level:
    org.springframework.web: INFO
    com.aliev.mes: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} %-5level [%X{traceId}] %logger{36}: %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health, info

server:
  port: 8888