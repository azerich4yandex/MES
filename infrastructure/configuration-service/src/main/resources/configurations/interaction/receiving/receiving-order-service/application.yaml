spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:6432/orderdb
    schema: externalorderdb
    username: root
    password: root

  jpa:
    hibernate:
      ddl-auto: validate
      show-sql: false
      properties:
        default_schema: externalorderdb
        hibernate:
          dialect: org.hibernate.dialect.PostgreSQLDialect
          format_sql: true

logging:
  level:
    org.springframework.web: INFO
    com.aliev.mes: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} %-5level [%X{traceId}] %logger{36}: %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health, info
